name: Fix Windows mode-preservation assertion

on:
  push:
    branches: [agent/tessera-harden]

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, '[fix-windows-mode-test]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tessera-harden
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Make the mode-preservation assertion platform-native
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_hardening.py")
          text = path.read_text(encoding="utf-8")
          old = '''    settings.chmod(0o640)
    apply_project(root, write=True)
    assert settings.stat().st_mode & 0o777 == 0o640
'''
          new = '''    settings.chmod(0o640)
    expected_mode = settings.stat().st_mode & 0o777
    apply_project(root, write=True)
    assert settings.stat().st_mode & 0o777 == expected_mode
'''
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one mode assertion block, found {text.count(old)}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
      - name: Install and run focused suite
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q tests/test_hardening.py
      - name: Commit the verified patch and remove this workflow
        shell: bash
        run: |
          rm .github/workflows/fix-windows-mode-test.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Make mode preservation test cross-platform"
          git push origin HEAD:agent/tessera-harden
