name: Finalize project-confinement patch

on:
  push:
    branches:
      - agent/tessera-harden

permissions:
  contents: write

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tessera-harden
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Materialize the patch when still staged
        shell: bash
        run: |
          if [ -f .tessera-publish/security_patch.py ]; then
            python .tessera-publish/security_patch.py
          else
            echo "project-confinement patch already materialized"
          fi
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Verify Node hook syntax
        run: node --check src/dual_log_engine/hardening/guard_runtime.mjs
      - name: Run hardening suite
        run: python -m pytest -q tests/test_hardening.py
      - name: Run full repository suite
        run: python -m pytest -q

  publish:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tessera-harden
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Materialize the patch when still staged
        shell: bash
        run: |
          if [ -f .tessera-publish/security_patch.py ]; then
            python .tessera-publish/security_patch.py
          fi
      - name: Remove all one-use publication artifacts
        shell: bash
        run: |
          rm -f .github/workflows/apply-project-confinement-patch.yml
          rm -f .github/workflows/finalize-project-confinement.yml
          rm -f .tessera-publish/security_patch.py
          rmdir .tessera-publish 2>/dev/null || true
      - name: Commit the validated final tree
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Confine hardening paths to project root"
          git push origin HEAD:agent/tessera-harden
