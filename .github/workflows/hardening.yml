name: Tessera Harden

on:
  pull_request:
    paths:
      - "src/dual_log_engine/hardening/**"
      - "src/dual_log_engine/governance/cli.py"
      - "tests/test_hardening.py"
      - "pyproject.toml"
      - ".github/workflows/hardening.yml"
  push:
    branches: [main]
    paths:
      - "src/dual_log_engine/hardening/**"
      - "src/dual_log_engine/governance/cli.py"
      - "tests/test_hardening.py"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  cross-platform-hardening:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Verify Node hook syntax
        run: node --check src/dual_log_engine/hardening/guard_runtime.mjs
      - name: Run hardening suite
        run: python -m pytest -q tests/test_hardening.py
      - name: Run full repository suite
        run: python -m pytest -q
