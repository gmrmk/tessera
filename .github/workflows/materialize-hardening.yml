name: Materialize Tessera Harden

on:
  push:
    branches: [agent/tessera-harden]

permissions:
  contents: write

jobs:
  materialize:
    if: contains(github.event.head_commit.message, '[materialize]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Materialize checksum-pinned source payload
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import io
          import shutil
          import tarfile
          from pathlib import Path

          root = Path.cwd().resolve()
          staging = root / ".tessera-publish"
          parts = sorted(staging.glob("payload.b64.part*"))
          if len(parts) != 11:
              raise SystemExit(f"expected 11 payload parts, found {len(parts)}")

          encoded = "".join(part.read_text(encoding="ascii") for part in parts)
          payload = base64.b64decode(encoded, validate=True)
          expected_archive_sha256 = "a1e3b38ffa68264cc49aeb1c04e1fc86cc44482ce7263c962a198117e8671c00"
          actual_archive_sha256 = hashlib.sha256(payload).hexdigest()
          if actual_archive_sha256 != expected_archive_sha256:
              raise SystemExit(
                  f"payload SHA-256 mismatch: {actual_archive_sha256} != {expected_archive_sha256}"
              )

          expected = {
              "src/dual_log_engine/hardening/guard_runtime.mjs": "a4bc866fc35945aab590802a58f47450c54f1a23",
              "src/dual_log_engine/hardening/installer.py": "d60a93bcdf29ead07fa082e880c05fe15cb7f7a5",
              "src/dual_log_engine/hardening/reporting.py": "d4a7f6c459e3ea23efaf2b41f69de1c3a5e23e21",
              "src/dual_log_engine/hardening/scanner.py": "e2a19fa4d24c4a992e2bfb483345d4c171ffb559",
              "src/dual_log_engine/hardening/verification.py": "a31cc0e4dd0a400c7275abe62507a05207cce686",
              "tests/test_hardening.py": "6344f251e3c85641b78414437657152daf82d824",
          }

          def git_blob_sha(data: bytes) -> str:
              header = f"blob {len(data)}\0".encode("ascii")
              return hashlib.sha1(header + data).hexdigest()

          with tarfile.open(fileobj=io.BytesIO(payload), mode="r:gz") as archive:
              members = archive.getmembers()
              names = {member.name for member in members}
              if names != set(expected):
                  raise SystemExit(
                      f"archive member mismatch: missing={sorted(set(expected) - names)} "
                      f"unexpected={sorted(names - set(expected))}"
                  )
              for member in members:
                  if not member.isfile() or member.issym() or member.islnk():
                      raise SystemExit(f"refusing non-regular archive member: {member.name}")
                  destination = (root / member.name).resolve()
                  if root not in destination.parents:
                      raise SystemExit(f"refusing path traversal: {member.name}")
                  extracted = archive.extractfile(member)
                  if extracted is None:
                      raise SystemExit(f"cannot read archive member: {member.name}")
                  data = extracted.read()
                  actual = git_blob_sha(data)
                  if actual != expected[member.name]:
                      raise SystemExit(
                          f"Git blob mismatch for {member.name}: {actual} != {expected[member.name]}"
                      )
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  destination.write_bytes(data)

          shutil.rmtree(staging)
          print("materialized and verified 6 source files")
          PY
      - name: Verify Node hook syntax
        run: node --check src/dual_log_engine/hardening/guard_runtime.mjs
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run focused release suite
        run: python -m pytest -q tests/test_hardening.py
      - name: Commit verified implementation and remove materializer
        shell: bash
        run: |
          rm .github/workflows/materialize-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Materialize Tessera Harden implementation"
          git push origin HEAD:agent/tessera-harden
